name: CI

# Reproduit exactement les validations exécutées manuellement avant chaque
# fusion depuis le chantier de consolidation du 2026-08-10 (cf. historique
# git : chaque merge --no-ff dans main a été précédé de check +
# makemigrations --check + tests côté backend, et de lint + tsc + tests +
# build côté frontend). Cette CI ne fait qu'automatiser ce qui était déjà
# fait à la main, rien de plus.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # Postgres/PostGIS et Redis ont un support natif "services" (image +
    # commande de démarrage par défaut suffisante). MinIO n'en a pas — son
    # image ne démarre le serveur que si on lui passe explicitement la
    # commande `server /data`, impossible à exprimer dans le bloc `services`
    # (pas de clé `command`) — d'où un `docker run` manuel en step, calqué
    # sur backend/docker-compose.yml (mêmes identifiants, même init de bucket
    # via `mc`).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: akal_user
          POSTGRES_PASSWORD: akal_password
          POSTGRES_DB: akal_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-jamais-utilisee-en-production
      DJANGO_SETTINGS_MODULE: akal.settings.dev
      DATABASE_URL: postgis://akal_user:akal_password@localhost:5432/akal_db
      REDIS_URL: redis://localhost:6379/1
      # Identifiants MinIO du docker-compose local (backend/docker-compose.yml)
      # — jamais des secrets réels, MinIO ne sert que le bucket éphémère du run.
      AWS_ACCESS_KEY_ID: akal
      AWS_SECRET_ACCESS_KEY: akal12345
      AWS_STORAGE_BUCKET_NAME: akal-media
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_S3_REGION_NAME: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Démarrer MinIO (même config que backend/docker-compose.yml)
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID \
            -e MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY \
            minio/minio server /data --console-address ":9001"

      - name: Attendre MinIO puis créer le bucket (équivalent du service minio-init local)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc -c "
            mc alias set local http://localhost:9000 $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY &&
            mc mb --ignore-existing local/$AWS_STORAGE_BUCKET_NAME &&
            mc anonymous set download local/$AWS_STORAGE_BUCKET_NAME
          "

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances système (GeoDjango / PostGIS — mêmes paquets que backend/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin python3-gdal gcc libpq-dev

      - name: Dépendances Python
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: makemigrations --check --dry-run
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: python manage.py test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    # Postgres/Redis minimaux pour le step Build ci-dessous UNIQUEMENT —
    # app/parcelles/[slug]/page.tsx (generateStaticParams) et la Home
    # appellent le vrai catalogue au moment du build (`next build`), pas
    # seulement au runtime. Constaté en pratique sur le premier run CI :
    # sans backend joignable, le build échoue en ECONNREFUSED — ça ne se
    # voyait jamais en local car un backend tournait déjà en tâche de fond.
    # Pas de MinIO ici : base tout juste migrée, aucune annonce, donc
    # aucune photo à servir — lint/tsc/tests n'en ont pas besoin non plus.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: akal_user
          POSTGRES_PASSWORD: akal_password
          POSTGRES_DB: akal_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-jamais-utilisee-en-production
      DJANGO_SETTINGS_MODULE: akal.settings.dev
      DATABASE_URL: postgis://akal_user:akal_password@localhost:5432/akal_db
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests
        working-directory: frontend
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances système (GeoDjango / PostGIS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils libproj-dev gdal-bin python3-gdal

      - name: Dépendances backend (pour un serveur local minimal)
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrer la base et démarrer Django en arrière-plan
        working-directory: backend
        run: |
          python manage.py ensure_postgis
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/annonces/ > /dev/null && break
            sleep 1
          done

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: npm run build

  # Valide que `docker compose up --build` (racine) monte toute la pile et
  # que le parcours de base répond — le test que fait un nouveau développeur.
  compose:
    name: Docker Compose (pile complète)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker compose up --build
        run: docker compose up --build -d --wait --wait-timeout 900

      - name: Le backend répond (healthz + catalogue seedé)
        run: |
          curl -fsS http://localhost:8000/healthz/ | grep -q '"status": "ok"'
          test "$(curl -fsS 'http://localhost:8000/api/annonces/?page_size=1' | python3 -c 'import sys,json; print(json.load(sys.stdin)["count"])')" -ge 1

      - name: Le frontend répond et sert le catalogue
        run: |
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/parcelles > /dev/null

      - name: Les photos s'affichent réellement (parcours catalogue → fiche)
        run: |
          # URL de photo d'une annonce seedée (django-storages → MinIO). Le
          # segment /akal-media/ (bucket) doit être présent — sinon MinIO 404.
          PHOTO=$(curl -fsS 'http://localhost:8000/api/annonces/?page_size=15' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(a["photo_principale"] for a in d["results"] if a.get("photo_principale")))')
          echo "photo: $PHOTO"
          echo "$PHOTO" | grep -q '/akal-media/' || { echo "URL de photo sans segment bucket"; exit 1; }
          # 1. la photo est servie en 200, en tant qu'image, par le bucket public
          test "$(curl -fsS -o /dev/null -w '%{content_type}' "$PHOTO" | cut -d/ -f1)" = "image"
          # 2. le HTML de la fiche référence bien cette URL (next/image en
          #    passthrough non optimisé sur ce profil — cf. next.config.ts)
          SLUG=$(curl -fsS 'http://localhost:8000/api/annonces/?page_size=15' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(a["slug"] for a in d["results"] if a.get("photo_principale")))')
          curl -fsS "http://localhost:3000/parcelles/$SLUG" | grep -q 'localhost:9000/akal-media/'

      - name: PostGIS actif, migrations à jour
        run: |
          docker compose exec -T backend python manage.py ensure_postgis
          docker compose exec -T backend python manage.py migrate --check

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --tail 120

      - name: Arrêt
        if: always()
        run: docker compose down -v
