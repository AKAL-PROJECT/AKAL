services:
  # PostgreSQL + PostGIS — la base de l'application. Port hôte 5433 (pas
  # 5432) pour ne pas entrer en conflit avec un Postgres déjà installé
  # localement ; DATABASE_URL doit donc pointer sur :5433 (cf. .env.example).
  # Django n'est PAS conteneurisé ici (venv local) : cette stack fournit les
  # dépendances de service (db, cache, stockage), pas l'app elle-même.
  db:
    image: postgis/postgis:16-3.4
    container_name: akal_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akal}
      POSTGRES_DB: ${POSTGRES_DB:-akal_db}
    ports:
      - "5433:5432"
    volumes:
      - akal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akal} -d ${POSTGRES_DB:-akal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: akal_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: akal_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-akal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-akal12345}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Conteneur one-shot : crée le bucket et le passe en lecture publique
  # (contrat §4.7) à chaque démarrage de la stack. Pas de restart policy —
  # il termine avec exit 0 une fois fait, "unless-stopped" le ferait boucler.
  minio-init:
    image: minio/mc:latest
    container_name: akal_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-akal} ${MINIO_ROOT_PASSWORD:-akal12345} &&
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-akal-media} &&
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-akal-media}
      "

volumes:
  minio_data:
  akal_db_data:
