databases:
  # Base de données PostgreSQL managée
  - name: akal-db
    plan: free
    databaseName: akal_db
    user: akal_user
    ipAllowList: []

services:
  # Service Web Django (conteneurisé via Docker)
  - type: web
    name: akal-backend
    env: docker
    rootDir: backend  # <-- LA LIGNE MAGIQUE EST ICI
    plan: free
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akal-db
          property: connectionString
          
      - key: DJANGO_SETTINGS_MODULE
        value: akal.settings.prod
        
      - key: SECRET_KEY
        generateValue: true
        
      - key: PYTHONUNBUFFERED
        value: "1"

    # Authentification par téléphone (SMS OTP) : nécessite un secret
    # firebase-service-account.json monté via l'onglet Secret Files de ce
    # service (Dashboard → akal-backend → Environment → Secret Files) à
    # /app/firebase-service-account.json — pas une envVar, non configurable
    # ici. Voir README.md, section "Firebase (authentification Google /
    # téléphone)". Sans ce fichier, le reste du service tourne normalement ;
    # seul l'endpoint de connexion par téléphone répond 503.