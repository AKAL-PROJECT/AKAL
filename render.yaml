# ══════════════════════════════════════════════════════════════════════════
#  Blueprint Render — pile AKAL complète
# ══════════════════════════════════════════════════════════════════════════
#
#        ┌────────────────┐      ┌────────────────┐
#        │  akal-frontend │─────▶│  akal-backend  │
#        │  Next.js (web) │ HTTPS│  Django/DRF    │
#        └────────────────┘      └───────┬────────┘
#                                        │
#                        ┌───────────────┼───────────────┐
#                        ▼               ▼               ▼
#                  ┌───────────┐   ┌───────────┐   ┌─────────────┐
#                  │  akal-db  │   │ akal-redis│   │  S3 externe │
#                  │ PG+PostGIS│   │ Key Value │   │ (R2/B2/MinIO│
#                  └───────────┘   └───────────┘   │  auto-héberg)│
#                                                  └─────────────┘
#
# Ce fichier provisionne akal-frontend, akal-backend, akal-db et akal-redis.
# Le stockage S3 (médias utilisateurs) est un service EXTERNE : Render ne
# fournit pas d'object storage — pointer AWS_S3_* vers un bucket compatible
# S3 en offre gratuite (Cloudflare R2, Backblaze B2) ou un MinIO auto-hébergé.
#
# Les variables `sync: false` apparaissent dans le dashboard Render de chaque
# service (Environment) sans valeur : à renseigner une fois à la main, jamais
# dans ce fichier (secrets, ou URLs connues seulement après le 1er déploiement).
#
# PostGIS : la base managée démarre « nue ». `akal-backend` lance
# `manage.py ensure_postgis` avant `migrate` (cf. backend/Dockerfile) —
# idempotent, aucune action manuelle requise.

databases:
  - name: akal-db
    plan: free
    region: frankfurt
    databaseName: akal_db
    user: akal_user
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ── Cache Redis (« Key Value » chez Render) ─────────────────────────────
  # Optionnel : le cache est fail-open (IGNORE_EXCEPTIONS, cf.
  # akal/settings/base.py + docs/plans/2026-08-31-redis-fail-open.md). Sans
  # REDIS_URL le backend tourne, mais throttling, cache des limites géo et
  # cache du Passeport AgriScore sont dégradés (chaque appel recalcule).
  # Retirer ce bloc ET la variable REDIS_URL pour s'en passer.
  - type: keyvalue
    name: akal-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    # Cache pur (throttling, limites géo, Passeport AgriScore) — aucune donnée
    # à conserver : éviction LRU quand la mémoire est pleine, pas de snapshot
    # sur disque. Redémarrage = cache vide, rechauffé au vol (fail-open).
    maxmemoryPolicy: allkeys-lru
    persistenceMode: "off"   # quoté : YAML lit `off` nu comme le booléen false

  # ── Backend Django / DRF (conteneurisé via backend/Dockerfile) ──────────
  - type: web
    name: akal-backend
    runtime: docker
    # PAS de rootDir : sans lui, dockerfilePath / dockerContext sont sans
    # ambiguïté relatifs à la RACINE du dépôt (les deux pages de doc Render
    # concordent sur ce cas). Avec rootDir, le dockerfilePath par défaut se
    # comporte différemment entre les pages « Blueprint Spec » et « Monorepo
    # Support » — c'est ce qui provoquait « failed to read dockerfile: open
    # Dockerfile: no such file or directory ». Coût : un push ne touchant que
    # frontend/ redéclenche aussi un build backend (négligeable en démo).
    # `dockerContext: backend` = `context: ./backend` de docker-compose.yml.
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akal-db
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: akal.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      # Plan free = 0,1 CPU / 512 Mo : 2 workers gunicorn tiennent, 3 font
      # ramer (OOM sous charge). Monter avec le plan.
      - key: WEB_CONCURRENCY
        value: "2"

      # Peuplement initial de la base au démarrage du conteneur (cf.
      # backend/docker-entrypoint.sh) : "1" charge le référentiel géo officiel
      # (12 régions / 75 provinces / 1536 communes, shapefiles embarqués dans
      # l'image) + ~15 annonces de démonstration. SANS lui, la base déployée
      # est VIDE : catalogue vide et `can_publish()` refuse toute annonce
      # (aucune commune à géolocaliser). Idempotent (import géo transactionnel,
      # seed_demo sauté si des annonces de démo existent déjà). Le laisser à
      # "1" en permanence est sûr (coût : ~15 s de réimport par redeploy) ;
      # ou le passer à "0" / le retirer une fois la base peuplée.
      - key: SEED_ON_START
        value: "1"

      # ── Cache Redis (référence croisée vers le service ci-dessus) ───────
      - key: REDIS_URL
        fromService:
          name: akal-redis
          type: keyvalue
          property: connectionString

      # ── Frontend / CORS / CSRF ────────────────────────────────────────
      # Backend et frontend sont sur des domaines distincts : sans ces
      # variables, prod hérite des défauts localhost de base.py → tout appel
      # du frontend déployé est bloqué et les liens de reset e-mail pointent
      # vers localhost. Renseigner avec l'URL d'akal-frontend (visible dans
      # son dashboard après le 1er déploiement).
      - key: FRONTEND_URL
        sync: false        # https://akal-frontend-XXXX.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # même URL (+ éventuel domaine custom, séparés par des virgules)
      - key: CSRF_TRUSTED_ORIGINS
        sync: false        # idem CORS_ALLOWED_ORIGINS
      - key: ALLOWED_HOSTS
        sync: false        # facultatif — `.onrender.com` est déjà couvert par défaut (prod.py)

      # ── Stockage média (django-storages, S3-compatible) ───────────────
      # Sans ces variables, S3Storage part avec des identifiants vides et
      # TOUT upload de photo/avatar échoue. Bucket public en LECTURE seule.
      # Runbook pas à pas (Cloudflare R2, offre gratuite) :
      #   docs/DEPLOIEMENT_MEDIA.md
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: akal-media
      - key: AWS_S3_ENDPOINT_URL
        sync: false        # R2 : https://<account_id>.r2.cloudflarestorage.com
      - key: AWS_S3_REGION_NAME
        value: auto        # R2 = "auto" ; B2 = "eu-central-003"… ; AWS = "eu-west-3"…
      # Domaine PUBLIC du bucket R2, SANS protocole ni chemin. Ce n'est pas un
      # secret (URL de lecture seule, visible dans le bundle navigateur) :
      # figé ici pour garantir qu'il est IDENTIQUE à NEXT_PUBLIC_MEDIA_HOSTNAME
      # côté akal-frontend — un décalage entre les deux = photos cassées à
      # l'affichage. Changer de bucket = éditer cette valeur ET l'autre.
      - key: AWS_S3_CUSTOM_DOMAIN
        value: pub-0028b352e2f74416afa532bee8e719bf.r2.dev

      # ── E-mail transactionnel (reset mdp, alertes de recherche) ───────
      # EMAIL_HOST vide → backend console (e-mails dans les logs). Renseigner
      # pour un vrai envoi SMTP.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: AKAL <no-reply@akal.ma>

      # ── Monitoring Sentry (no-op si SENTRY_DSN vide) ──────────────────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

      # ── Auth Google (GoogleLoginView) — même Client ID OAuth 2.0 que
      # NEXT_PUBLIC_GOOGLE_CLIENT_ID côté frontend (ils DOIVENT matcher).
      # Sans elle : seul l'endpoint /api/auth/google/ répond 503.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ── AgriScore — agents à source externe (tous facultatifs) ────────
      # Sans clé, l'agent passe « indisponible » et le Passeport se calcule
      # sur les dimensions restantes. sol/climat/accès/topo sont keyless.
      - key: CDSE_CLIENT_ID
        sync: false        # NDVI Sentinel-2 — compte gratuit dataspace.copernicus.eu
      - key: CDSE_CLIENT_SECRET
        sync: false
      - key: OPENTOPOGRAPHY_API_KEY
        sync: false        # agent topo GLO-30 optionnel — inutile pour le pipeline par défaut
      - key: AGRISCORE_HTTP_TIMEOUT_S
        value: "10"

    # Auth par téléphone (SMS OTP, Firebase) : nécessite le secret
    # firebase-service-account.json monté via Dashboard → akal-backend →
    # Environment → Secret Files, à /app/firebase-service-account.json (pas
    # une envVar). Sans lui, seul /api/auth/phone/verify/ répond 503.
    # Voir README.md et docs/ONBOARDING_SECRETS.md.

  # ── Frontend Next.js ───────────────────────────────────────────────────
  # Alternative : déployer sur Vercel (retirer ce bloc). `next build`
  # interroge le catalogue au build — s'il échoue (backend pas encore
  # prêt), le build réussit quand même sans pré-générer de fiche (fix de
  # app/parcelles/[slug]/page.tsx), elles sont rendues à la demande.
  - type: web
    name: akal-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: frankfurt
    # `output: "standalone"` (next.config.ts) → le serveur de prod est
    # `.next/standalone/server.js`, PAS `next start` (qui, avec standalone,
    # avertit « does not work » et n'est pas le chemin supporté). server.js ne
    # copie pas `public/` ni `.next/static/` — à faire à la main après le
    # build (cf. doc Next « output »). Même serveur que frontend/Dockerfile.
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    # HOSTNAME=0.0.0.0 : server.js fait `process.env.HOSTNAME || '0.0.0.0'` et
    # l'environnement Render (runtime node) définit HOSTNAME = nom du pod → le
    # serveur se lie à `<pod>:10000` au lieu de `0.0.0.0:10000`, injoignable
    # par le routeur Render → 502. Le Dockerfile frontend force déjà
    # ENV HOSTNAME=0.0.0.0 ; ici il faut le refaire côté startCommand.
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    # Route Handler statique (app/healthz/route.ts) — répond 200 sans toucher
    # à l'API. Pointer `/` ici couplait le succès du déploiement à l'état du
    # backend : si l'API n'est pas joignable au moment du health check (cold
    # start free tier, ordre de déploiement), `/` renvoie 500 → `Timed Out`.
    healthCheckPath: /healthz

    envVars:
      # URL publique d'akal-backend (visible dans son dashboard après le 1er
      # déploiement) suffixée de /api. Utilisée AU BUILD et au runtime.
      - key: NEXT_PUBLIC_API_URL
        sync: false        # https://akal-backend-XXXX.onrender.com/api
      # URL publique de CE service, pour les URLs canoniques (sitemap, robots).
      - key: NEXT_PUBLIC_SITE_URL
        sync: false        # https://akal-frontend-XXXX.onrender.com
      # Jamais "true" en prod (le build échoue par garde-fou, next.config.ts).
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"

      # Domaine public du bucket média — next/image refuse toute image d'un
      # hôte non listé. Figé ici, IDENTIQUE à AWS_S3_CUSTOM_DOMAIN côté
      # akal-backend. Pas un secret. Sans ça : upload OK mais photos cassées à
      # l'affichage. Utilisée AU BUILD (inlinée dans next.config.ts) → tout
      # changement impose un « Manual Deploy → Clear build cache & deploy ».
      - key: NEXT_PUBLIC_MEDIA_HOSTNAME
        value: pub-0028b352e2f74416afa532bee8e719bf.r2.dev

      # Google Sign-In — même valeur que GOOGLE_CLIENT_ID du backend.
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

      # Sentry navigateur (un DSN n'est pas un secret — il n'autorise qu'à
      # envoyer des événements). Vide = monitoring front désactivé.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: production

      # Firebase (auth téléphone SMS uniquement) — config web publique, cf.
      # frontend/.env.example et docs/ONBOARDING_SECRETS.md.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
        sync: false
